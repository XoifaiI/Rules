[versions]
assertj = "3.27.7"
errorprone = "2.50.0"
errorprone-plugin = "5.1.1"
extra-java-module-info = "1.14.2"
jspecify = "1.0.1"
junit = "6.1.3"
nullaway = "0.14.1"
palantir = "2.98.0"
re2j = "1.8"
spotless = "8.10.2"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
re2j = { module = "com.google.re2j:re2j", version.ref = "re2j" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
extra-java-module-info = { id = "org.gradlex.extra-java-module-info", version.ref = "extra-java-module-info" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
